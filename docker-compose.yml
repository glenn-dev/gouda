services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gouda
      POSTGRES_USER: gouda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gouda-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gouda -d gouda"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  gouda-postgres-data:
